<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg">

    <!-- Logo -->
    <div class="flex items-center rounded-md py-2 w-full justify-center mb-6">
      <img src="images/logo.png" alt="Skinora Logo" class="h-12" />
      <span class="text-3xl font-medium text-primary ml-2">Skin<span class="text-secondary">Ora</span></span>
    </div>

    <h2 class="text-xl font-medium text-center mb-1">Sign In</h2>
    <p class="text-center text-gray-500 mb-6">
      Use your email or phone number to sign in
    </p>

    <!-- Message Display -->
    <div *ngIf="message"
         class="mb-6 p-3 rounded text-center text-sm border"
         [ngClass]="{
           'bg-green-100 text-green-700 border-green-300': messageType === 'success',
           'bg-red-100 text-red-700 border-red-300': messageType === 'error'
         }">
      {{ message }}
    </div>

    <!-- Form -->
    <form (ngSubmit)="handleSubmit(loginForm)" #loginForm="ngForm" class="space-y-4">

      <input
        type="email"
        placeholder="Email Address"
        [(ngModel)]="email"
        name="email"
        required
        email
        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary"
      />

      <input
        type="password"
        placeholder="Password"
        [(ngModel)]="password"
        name="password"
        required
        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary"
      />

      <p class="text-sm text-gray-500">
        By signing in you agree to our
        <a href="/terms" class="font-medium text-primary/80 hover:text-secondary underline">Terms & Conditions</a>.
      </p>

      <button
        type="submit"
        class="w-full bg-primary text-white py-3 rounded-lg hover:bg-primary/90 transition-colors font-medium"
      >
        Sign In
      </button>
    </form>

    <!-- Register link -->
    <p class="text-center mt-6 text-sm text-gray-600">
      Don't have an account?
      <a href="/register" class="font-medium text-primary/80 hover:text-secondary underline">
        Register here
      </a>
    </p>

  </div>
</div>
