<div class="flex min-h-screen items-center justify-center">
  <div class="w-full max-w-md p-6 rounded-xl shadow-xl bg-white">
    <!-- Logo -->
    <div class="flex flex-col items-center">
        <div class="flex items-center rounded-md py-2 w-full justify-center">
          <img src="images/logo.png" alt="Skinora Logo" class="h-12" />
          <span class="text-3xl font-medium text-primary">Skin<span class="text-secondary">Ora</span></span>
        </div>
      <h2 class="mt-4 text-4xl font-semibold text-primary">Create Account</h2>
      <p class="text-gray-700 text-center">
        Fill in the details to create your account
      </p>
    </div>

    <!-- Message -->
    <div
      *ngIf="message"
      class="mt-6 p-3 text-sm rounded-lg text-center"
      [ngClass]="{
        'bg-green-100 text-green-700': messageType === 'success',
        'bg-red-100 text-red-700': messageType === 'error'
      }"
    >
      {{ message }}
    </div>

    <!-- Form -->
    <form (ngSubmit)="handleSubmit()" class="flex flex-col mt-8 space-y-4" #registerForm="ngForm">
      <div>
        <label class="text-gray-800">Full Name</label>
        <input
          type="text"
          placeholder="John Doe"
          [(ngModel)]="name"
          name="name"
          required
          class="w-full border rounded-lg px-4 py-2"
        />
      </div>

      <div>
        <label class="text-gray-800">Email Address</label>
        <input
          type="email"
          placeholder="your@gmail.com"
          [(ngModel)]="email"
          name="email"
          required
          class="w-full border rounded-lg px-4 py-2"
        />
      </div>

      <div>
        <label class="text-gray-800">Password</label>
        <input
          type="password"
          placeholder="Create a password"
          [(ngModel)]="password"
          name="password"
          required
          class="w-full border rounded-lg px-4 py-2"
        />
      </div>

      <div>
        <label class="text-gray-800">Confirm Password</label>
        <input
          type="password"
          placeholder="Confirm password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          required
          class="w-full border rounded-lg px-4 py-2"
        />
      </div>

      <p class="text-gray-800 font-serif text-sm">
        By creating an account you agree to our
        <a href="/terms" class="font-medium text-primary/80 hover:text-secondary underline">
          Terms & Conditions
        </a>.
      </p>

      <button
        type="submit"
        class="mt-8 bg-primary text-white hover:bg-secondary mx-auto block px-5 py-2 rounded-lg font-semibold transition w-full duration-200"
      >
        Register
      </button>
    </form>

    <!-- Login -->
    <p class="mt-4 text-center text-gray-800 font-serif">
      Already have an account?
      <a href="/login" class="font-medium text-primary/80 hover:text-secondary underline">
        Sign in here
      </a>
    </p>

  </div>
</div>
